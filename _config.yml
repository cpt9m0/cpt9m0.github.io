accent_color: "#500000"
dark_mode: true
description: "Computer Engineering Ph.D. student at Texas A&M University researching cybersecurity, access control, system security, reverse engineering, and LLMs for security."
baseurl: ""
url: "https://ali-ayati.com"

analytics:
  google_id: "G-8PN2TMLNCT"

# SEO Verification
google_site_verification: ""
bing_site_verification: ""

# ============================================================
# STEP 4: Choose Your Pages
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: research
  - name: projects
  - name: teaching
  - name: blogs

# ============================================================
# Advanced Settings
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

permalink: /blogs/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll-scholar", "jekyll-sitemap"]

scholar:
  last_name: Ayati
  first_name: [Seyyed Ali, Ali, S. A.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - vendor
  - .bundle
  - _site
  - .sass-cache
  - .jekyll-cache
  - markdown_generator
  - talkmap
  - AGENTS.md
  - jekyll.log
